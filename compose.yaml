services:
  web:
    build: .
    container_name: aws-devops-demo
    restart: unless-stopped
    ports:
      - "80:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
